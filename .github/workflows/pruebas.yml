name: Pruebas

on:
  push:
  workflow_dispatch:

# El token del workflow solo puede leer el repositorio: ninguna acción puede escribir en él (A03).
permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencias fijadas, verificadas por hash
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Las librerías de seguridad cargan
        run: python -c "import argon2, cryptography.fernet; print('OK')"

      - name: Autoverificación del dominio
        run: python viajes.py

      - name: Sesión completa del menú con los dos roles
        run: python herramientas/driver.py

      - name: El código implementa el diagrama de clases sin diferencias
        run: python herramientas/uml_vs_codigo.py

      - name: Prueba por indicador de la rúbrica
        run: python pruebas/prueba_rubrica.py

  mutaciones:
    # Rompe cada regla a propósito y exige que alguna prueba lo detecte. Tarda unos minutos, por
    # eso corre en una sola combinación.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencias fijadas, verificadas por hash
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Cada regla tiene una prueba que la vigila
        run: python herramientas/mutaciones.py
