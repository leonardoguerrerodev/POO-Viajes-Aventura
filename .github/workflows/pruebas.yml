name: Pruebas

on:
  push:
  workflow_dispatch:

# El token del workflow solo puede leer el repositorio: ninguna acción puede escribir en él (A03).
permissions:
  contents: read

# Las acciones se fijan por el hash de su commit, no por una etiqueta que se puede mover: lo que corre
# es exactamente lo que se revisó (A03, cadena de suministro).
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Dependencias fijadas, verificadas por hash
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Reglas del negocio R1 a R17
        run: python pruebas/verificar.py --solo reglas

      - name: POO, persistencia y CRUD (G.13 a G.15)
        run: python pruebas/verificar.py --solo implementacion

      - name: Autenticación y credenciales (G.17, G.18)
        run: python pruebas/verificar.py --solo credenciales

      - name: Datos personales (I.19)
        run: python pruebas/verificar.py --solo datos

      - name: Seguridad (I.20)
        run: python pruebas/verificar.py --solo seguridad

      - name: Recorrido del menú real con los dos roles
        run: python pruebas/verificar.py --solo menu

      - name: Diagrama de clases contra código (G.13, I.8)
        run: python pruebas/verificar.py --solo uml

  mutaciones:
    # Rompe cada regla a propósito y exige que alguna prueba lo detecte. Tarda unos minutos, por
    # eso corre en una sola combinación.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Dependencias fijadas, verificadas por hash
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Cada regla tiene una prueba que la vigila
        run: python pruebas/verificar.py --solo mutaciones
