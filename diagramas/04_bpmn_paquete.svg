<text x="265" y="193.0" font-family="Liberation Sans" font-size="7.5" text-anchor="end" fill="#000" font-style="italic"><tspan x="265" dy="0">fechas, cupo y margen</tspan></text>
<text x="265" y="202.0" font-family="Liberation Sans" font-size="7.5" text-anchor="end" fill="#000" font-style="italic"><tspan x="265" dy="0">válidos? (R3, R5, R6, R8)</tspan></text>
